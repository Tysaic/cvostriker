{% extends 'base.html' %}

{% block title %}OTP settings{% endblock title %}
{% block content %}
    <div class="box">
        <div class="columns">
            <div class="column is-full has-text-centered">
                <header>
                    <h3 class="title is-3">OTP Settings</h3>
                </header>
                {% if message %}
                    <p>OTP QR configurated succesfully</p>
                {% endif %}
                {% if qr_validator %}
                    <form action="{{ url_for('configuration_otp_delete') }}" method="POST">
                        <input type="hidden" value="{{ csrf_token() }}" name="csrf_token"> 
                        <p>Date OTP Created: {{user.otp_created_at}}</p>
                            <div class="field">
                                <div class="control">
                                    <button type="submit" class="button is-danger">Delete</button>
                                </div>
                            </div>
                    </form>

                {% else %}
                    <form action="{{ url_for('show_qr_code') }}" method="POST">
                        <input type="hidden" value="{{ csrf_token() }}" name="csrf_token"> 
                        <div class="field">
                            <div class="control">
                                <button class="button is-success" type="submit">Enable</button>
                            </div>
                        </div>
                    </form>
                {% endif %}

            </div>
        </div>
    </div>
{% endblock content %}
