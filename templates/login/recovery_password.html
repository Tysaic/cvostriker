{% extends 'login/main.html' %}

{% block title %}
    <title>Recovery Password</title>
{% endblock title %}
{% block content %}
    <section class="hero is-success is-fullheight">
        <div class="hero-body">
            <div class="container has-text-centered">
                <div class="column is-4 is-offset-4">
                    {% if message %}
                        <h1 id="message">{{message}}</h1>
                    {% endif %}
                    <h3 class="title has-text-black">Recovery Password/Account</h3>
                    <hr class="login-hr">
                    <div class="box">
                        <figure class="avatar">
                            <img src="https://via.placeholder.com/150">
                        </figure>
                        <form action="{{ url_for('recovery_password', token=token) }}" method="POST" >
                            <input type="hidden" value="{{ csrf_token() }}" name="csrf_token"> 
                            <p id="password-error"></p>
                            <div class="field">
                                <div class="control">
                                    <input class="input is-large" placeholder="New Password" type="password" id="new_password" name="new_password" required><br>
                                </div>
                            </div>
                            <div class="field">
                                <div class="control">
                                    <input class="input is-large" placeholder="Confirm Password" type="password" id="confirm_password" name="confirm_password" required><br>
                                </div>
                            </div>
                        <div class="field">
                            <div class="control">
                                <input type="checkbox" class="form-check-input" id="show_passwords" onclick="togglePasswords()">
                                <label class="form-check" for="show_passwords">Show Passwords</label>
                            </div>
                        </div>
                            <button class="button is-block is-light is-large is-fullwidth" type="submit">Send<i class="fa fa-sign-in" aria-hidden="true"></i></button>
                        </form>
                    </div>
                    
                </div>
            </div>
        </div>
    </section>
{% endblock %}

    {% block javascript %}
        <script>
            document.querySelector('form').addEventListener('submit',
                function(event){
                    const newPassword = document.getElementById('new_password').value;
                    const confirmPassword = document.getElementById('confirm_password').value;

                    if (newPassword.length <12 || !/[!@#$%^&*(),.?":{}|<>]/.test(newPassword) ){
                        event.preventDefault();
                        alert("Password without 12 elements of lenght or/and doesnt get any special characters like those '[!@#$%^&*(),.?:{}|<>]' ")
                    }
                    else if(newPassword != confirmPassword){
                        event.preventDefault();
                        alert("Password don't match please try again.")
                    }
                }
            )
        </script>
    {% endblock javascript %}
