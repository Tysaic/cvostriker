{% extends 'login/main.html' %}

{% block title %}
    <title>Login Page</title>
{% endblock title %}

{% block content %}
    <section class="hero is-success is-fullheight">
        <div class="hero-body">
            <div class="container has-text-centered">
                <div class="column is-4 is-offset-4">
                    {% if message %}
                        <p>{{message}}</p>
                    {% endif %}
                    <h3 class="title has-text-black">Login</h3>
                    <hr class="login-hr">
                    <p class="subtitle has-text-black">Please login to proceed.</p>
                    <div class="box">
                        <figure class="avatar">
                            <img src="https://via.placeholder.com/150">
                        </figure>
                        <form action="/login" method="POST">
                            <input type="hidden" value="{{ csrf_token() }}" name="csrf_token"> 
                            <div class="field">
                                <div class="control">
                                    <input class="input is-large" placeholder="Your Username!" autofocus="" type="text" id="username" name="username" required><br><br>
                                </div>
                            </div>

                            <div class="field">
                                <div class="control">
                                    <input class="input is-large" placeholder="Your Password" type="password" id="password" name="password" required><br><br>
                                </div>
                            </div>
                            <div class="field">
                                <div class="control">
                                    <input class="input" placeholder="OTP is enabled!" type="text" id="otp" name="otp"> <br><br>
                                </div>
                            </div>
                            <button class="button is-block is-info is-light is-fullwidth" type="submit">Login <i class="fa fa-sign-in" aria-hidden="true"></i></button>
                            <div class="field">
                                <div class="control has-text-centered">
                                    <a href="{{ url_for('reset_password') }}" class="button is-text is-small">Forgot your password?</a>
                                </div>
                            </div>
                        </form>
                    </div>
                    
                </div>
            </div>
        </div>
    </section>
{% endblock %}
