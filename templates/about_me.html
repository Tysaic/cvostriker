{% extends 'base.html' %}

{% block title %}General Info{% endblock title %}
{% block content %}
    <h1 class="title">General Info</h1>
    <form action="{{ url_for('about_me') }}" method="POST" enctype="multipart/form-data">
        <input type="hidden" value="{{ csrf_token() }}" name="csrf_token">

        <div class="columns is-multiline">
            <div class="column is-half">
                <div class="field">
                    <label class="label" for="name">Name:</label>
                    <div class="control">
                        <input class="input" type="text" id="name" name="name" value="{{ general_info.name if general_info else '' }}">
                    </div>
                </div>
            </div>
            <div class="column is-half">
                <div class="field">
                    <label class="label" for="coname">Coname:</label>
                    <div class="control">
                        <input class="input" type="text" id="coname" name="coname" value="{{ general_info.coname if general_info else '' }}">
                    </div>
                </div>
            </div>

            <div class="column is-half">
                <div class="field">
                    <label class="label" for="email">Email:</label>
                    <div class="control">
                        <input class="input" type="text" id="email" name="email" value="{{ general_info.email if general_info else '' }}">
                    </div>
                </div>
            </div>
            <div class="column is-half">
                <div class="field">
                    <label class="label" for="phone">Phone:</label>
                    <div class="control">
                        <input class="input" type="text" id="phone" name="phone" value="{{ general_info.phone if general_info else '' }}">
                    </div>
                </div>
            </div>

            <div class="column is-half">
                <div class="field">
                    <label class="label" for="address">Address:</label>
                    <div class="control">
                        <input class="input" type="text" id="address" name="address" value="{{ general_info.address if general_info else '' }}">
                    </div>
                </div>
            </div>
            <div class="column is-half">
                <div class="field">
                    <label class="label" for="country">Country:</label>
                    <div class="control">
                        <input class="input" type="text" id="country" name="country" value="{{ general_info.country if general_info else '' }}">
                    </div>
                </div>
            </div>

            <div class="column is-full">
                <div class="field">
                    <label class="label" for="short_description">Short Description:</label>
                    <div class="control">
                        <textarea class="textarea" id="short_description" name="short_description">{{ general_info.short_description if general_info else '' }}</textarea>
                    </div>
                </div>
            </div>
        </div>

        <div class="field">
            <div class="control">
                <button class="button is-primary" type="submit">Save</button>
            </div>
        </div>
    </form>
{% endblock content %}
